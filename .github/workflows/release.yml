name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'  # e.g. v0.2.0, v1.0.0, v1.2.3rc1

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    outputs:
      is-stable: ${{ steps.check-tag.outputs.stable }}

    steps:
      - name: Classify tag # Decides if this is a prerelease tag or a release that will go to PyPI.
        id: check-tag
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up toolchain
        uses: ./.github/actions/setup-python-hatch
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: hatch build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ${{ needs.build.outputs.is-stable != 'true' && '--prerelease' || '' }} \
            dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.is-stable == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
